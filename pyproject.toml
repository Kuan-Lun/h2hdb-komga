[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "h2hdb-komga"
version = "0.8.1"
description = ""
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["h2hdb>=0.28.0,<0.29", "requests>=2.34.2,<3.0.0"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "hatchling>=1.32.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/h2hdb-komga"
Source = "https://github.com/Kuan-Lun/h2hdb-komga"
Tracker = "https://github.com/Kuan-Lun/h2hdb-komga/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h2hdb_komga"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "UP"]
# Ruff format can intentionally retain long URLs, strings, and docstrings.
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.h2h.version]
release-paths = ["LICENSE", "src/**"]
